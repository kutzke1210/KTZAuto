<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autobahn - 3D Fahrspiel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }

#hud {
  position: fixed; top: 20px; left: 0; right: 0;
  display: flex; justify-content: space-between; padding: 0 30px;
  pointer-events: none; z-index: 10;
  color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  user-select: none;
}
#hud > div {
  background: rgba(0,0,0,0.5); border-radius: 12px;
  padding: 12px 24px; backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.1);
}
.hud-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; }
.hud-value { font-size: 32px; font-weight: 700; letter-spacing: 1px; }
.hud-unit { font-size: 14px; opacity: 0.6; margin-left: 4px; }
#gear-display {
  display: inline-block;
  font-size: 18px; font-weight: 800;
  margin-left: 10px; padding: 2px 8px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 4px;
  vertical-align: middle;
  color: rgba(255,255,255,0.5);
  border-color: rgba(255,255,255,0.2);
}
#brake-indicator {
  display: inline-block; width: 10px; height: 10px;
  border-radius: 50%; background: #ff2200;
  margin-left: 8px; vertical-align: middle;
  opacity: 0; transition: opacity 0.1s;
  box-shadow: 0 0 8px #ff2200;
}

#center-hud {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  z-index: 10; text-align: center;
  color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  pointer-events: none;
}
#credit-tag {
  position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
  z-index: 15; pointer-events: none; text-align: center;
  font-size: 10px; letter-spacing: 1.5px; opacity: 0.4;
  color: #fff; font-family: 'Segoe UI',Arial,sans-serif;
  text-shadow: 0 2px 6px rgba(0,0,0,0.7);
}
#speed-limit {
  font-size: 14px; opacity: 0; letter-spacing: 3px;
  transition: opacity 0.3s;
  background: rgba(0,0,0,0.4); padding: 6px 16px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
}

#overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
  color: #fff; transition: opacity 0.5s, visibility 0.5s;
}
#overlay.hidden { opacity: 0; visibility: hidden; }
#overlay h1 { font-size: 64px; font-weight: 800; letter-spacing: 6px; margin-bottom: 8px; }
#overlay .subtitle { font-size: 20px; opacity: 0.6; letter-spacing: 8px; margin-bottom: 40px; }
#overlay .final-score { font-size: 28px; margin-bottom: 8px; }
#overlay .final-detail { font-size: 16px; opacity: 0.6; margin-bottom: 4px; }
#overlay .prompt {
  margin-top: 40px; font-size: 18px; opacity: 0.8;
  animation: pulse 1.5s ease-in-out infinite;
  border: 2px solid rgba(255,255,255,0.3); padding: 12px 32px; border-radius: 8px;
  cursor: pointer; pointer-events: auto;
}
#overlay .prompt:hover { background: rgba(255,255,255,0.1); }
@keyframes pulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.03); }
}

/* ── Personal Records Overlay ── */
#overlay-records {
  margin: 20px auto 0;
  padding: 18px 28px;
  border: 1px solid rgba(200,40,40,0.25);
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  max-width: 420px;
  text-align: center;
}
#overlay-records .rec-title {
  font-size: 11px; letter-spacing: 3px;
  color: rgba(200,40,40,0.8); margin-bottom: 10px;
}
#overlay-records .rec-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; margin-bottom: 12px;
}
#overlay-records .rec-item { text-align: center; }
#overlay-records .rec-label {
  font-size: 9px; text-transform: uppercase;
  letter-spacing: 1px; opacity: 0.5; margin-bottom: 2px;
}
#overlay-records .rec-value {
  font-size: 18px; font-weight: 700; letter-spacing: 1px;
}
#overlay-records .rec-rank-section {
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 10px; margin-top: 6px;
}
#overlay-records .rec-current-rank {
  font-size: 22px; font-weight: 800;
  letter-spacing: 4px; color: #cc3333;
  text-shadow: 0 0 20px rgba(200,40,40,0.3);
}
#overlay-records .rec-next-section {
  display: flex; justify-content: center; gap: 24px;
  margin-top: 6px; font-size: 12px; opacity: 0.7;
}
#overlay-records .rec-new-record {
  color: #ffcc00; font-weight: 700; font-size: 14px;
  letter-spacing: 2px;
  text-shadow: 0 0 12px rgba(255,204,0,0.3);
  margin-bottom: 6px;
}

@media (max-width: 640px) {
  #hud { padding: 0 12px; }
  #hud > div { padding: 8px 14px; }
  .hud-value { font-size: 22px; }
  #overlay h1 { font-size: 36px; }
}

#mobile-controls {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  pointer-events: none; user-select: none;
  padding: 8px 16px 32px;
  display: flex; justify-content: space-between; align-items: flex-end;
}
#mobile-controls * { pointer-events: auto; }
.mc-btn {
  width: 64px; height: 64px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
  color: #fff; font-size: 24px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  touch-action: none; -webkit-tap-highlight-color: transparent;
  transition: background .1s, transform .1s;
}
.mc-btn:active, .mc-btn.pressed { background: rgba(255,255,255,0.2); transform: scale(0.88); }
.mc-group {
  display: flex; gap: 12px; align-items: center;
}
.mc-group-left { justify-content: flex-start; }
.mc-group-right { flex-direction: column-reverse; gap: 8px; }
.mc-gas { border-color: rgba(0,255,100,0.35); }
.mc-gas:active, .mc-gas.pressed { background: rgba(0,255,100,0.2); }
.mc-brake { border-color: rgba(255,50,0,0.35); }
.mc-brake:active, .mc-brake.pressed { background: rgba(255,50,0,0.2); }

@media (hover: hover), (min-width: 1025px) {
  #mobile-controls { display: none; }
}
@media (hover: none) and (max-width: 1024px) {
  #radio { display: none; }
}

/* ── Mobile Landscape ── */
@media (orientation: landscape) and (max-height: 520px) {
  #hud { top: 6px; padding: 0 8px; }
  #hud > div { padding: 4px 10px; border-radius: 8px; }
  .hud-label { font-size: 8px; letter-spacing: 1px; }
  .hud-value { font-size: 16px; }
  .hud-unit { font-size: 10px; }
  #gear-display { font-size: 13px; margin-left: 6px; padding: 1px 5px; }
  #brake-indicator { width: 6px; height: 6px; margin-left: 4px; }
  #center-hud { bottom: auto; top: 40px; }
  #speed-limit { font-size: 10px; padding: 3px 10px; }
  #credit-tag { font-size: 7px; top: 4px; opacity: 0.25; }
  #mobile-controls { padding: 2px 8px 8px; }
  #mobile-controls .mc-btn { width: 44px; height: 44px; font-size: 16px; }
  #mobile-controls .mc-group { gap: 6px; }
  #mobile-controls .mc-group-right { gap: 4px; }
}
</style>
</head>

<div id="hud">
  <div>
    <div class="hud-label">Geschwindigkeit</div>
    <div class="hud-value">
      <span id="speed-display">0</span><span class="hud-unit">km/h</span>

<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const LANE_W = 4.0;
const PLAYER_LANES = [-8, -4, 0, 4, 8];
const ONCOMING_CENTER = 17;
const MEDIAN_X = 10.5;

const ROAD_HALF = 9.8;
const SPAWN_Z = -300;
const DESPAWN_Z = 60;
const BASE_SPEED = 45;
const MAX_SPEED = 125;           // 400 km/h
const MIN_SPEED = 0;
const CRUISE_SPEED = 46.875;     // 150 km/h
const CRUISE_ACCEL = 16;         // acceleration rate toward cruise
const CRUISE_DECEL = 8;          // deceleration rate back to cruise
const DRAG_COEFF = 0.00026;      // aerodynamic drag (quadratic)
const CAR_LENGTH = 3.4;
const CAR_WIDTH = 1.7;
const TRUCK_LENGTH = 7.0;
const TRUCK_WIDTH = 2.1;
const TRACK_X_AMPLITUDE = 7.5;
const TRACK_X_VARIATION = 2.4;
const TRACK_Y_AMPLITUDE = 0.42;
const TRACK_Y_VARIATION = 0.24;
const TRACK_ANGLE_AMPLITUDE = 0.08;
const PLAYER_CAR_RIDE_HEIGHT = 0.16;
const NPC_CAR_RIDE_HEIGHT = 0.14;

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const RANKS = [
  { time: 0, title: "Noob" },
  { time: 300, title: "Street Driver" },
  { time: 600, title: "Pro" },
  { time: 900, title: "Highway Racer" },
  { time: 1200, title: "Elite Driver" },
  { time: 1500, title: "Hacker" },
  { time: 2100, title: "Night Rider" },
  { time: 2700, title: "Asphalt King" },
  { time: 3600, title: "Highway Ghost" },
  { time: 5400, title: "Urban Legend" },
  { time: 7200, title: "Phantom Driver" },
];

function calculateRank(time) {
  let r = RANKS[0];
  for (const rank of RANKS) {
    if (time >= rank.time) r = rank;
    else break;
  }
  return r;
}

function getNextRank(time) {
  for (let i = 0; i < RANKS.length; i++) {
    if (time < RANKS[i].time) return RANKS[i];
  }
  return null;
}

function getRemainingTime(time) {
  const next = getNextRank(time);
  if (!next) return 0;
  return next.time - time;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

const SAVE_KEY = 'autobahn_records';

function defaultSave() {
  return { bestTime: 0, bestDistance: 0, topSpeed: 0, rank: RANKS[0].title, date: '' };
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return defaultSave();
    return {
      bestTime: typeof data.bestTime === 'number' ? data.bestTime : 0,
      bestDistance: typeof data.bestDistance === 'number' ? data.bestDistance : 0,
      topSpeed: typeof data.topSpeed === 'number' ? data.topSpeed : 0,
      rank: typeof data.rank === 'string' ? data.rank : RANKS[0].title,
      date: typeof data.date === 'string' ? data.date : '',
    };
  } catch (e) {
    return defaultSave();
  }
}

function saveProgress(save) {
  try {
    save.rank = calculateRank(save.bestTime).title;
    save.date = new Date().toLocaleDateString('de-DE');
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch (e) {}
}

function formatRankHTML(save) {
  const currentRank = calculateRank(save.bestTime);
  const nextRank = getNextRank(save.bestTime);
  const rem = getRemainingTime(save.bestTime);
  const timeStr = save.bestTime > 0 ? formatTime(save.bestTime) : '--:--';
  const distStr = save.bestDistance > 0 ? (save.bestDistance / 1000).toFixed(1) + ' km' : '-- km';
  const speedStr = save.topSpeed > 0 ? Math.round(save.topSpeed * 3.2) + ' km/h' : '-- km/h';
  let html = '<div class="rec-title">PERSONAL RECORDS</div>';
  html += '<div class="rec-grid">';
  html += '<div class="rec-item"><div class="rec-label">BEST TIME</div><div class="rec-value">' + timeStr + '</div></div>';
  html += '<div class="rec-item"><div class="rec-label">TOP SPEED</div><div class="rec-value">' + speedStr + '</div></div>';
  html += '<div class="rec-item"><div class="rec-label">DISTANCE</div><div class="rec-value">' + distStr + '</div></div>';
  html += '</div>';
  html += '<div class="rec-rank-section">';
  html += '<div class="rec-current-rank">' + currentRank.title + '</div>';
  if (nextRank) {
    html += '<div class="rec-next-section"><span>NEXT: ' + nextRank.title + '</span><span>LEFT: ' + formatTime(rem) + '</span></div>';
  } else {
    html += '<div class="rec-next-section"><span>MAXIMUM RANK ACHIEVED</span></div>';
  }
  html += '</div>';
  return html;
}

let saveData = loadSave();

const S = {
  speed: 0,
  steerAngle: 0,
  lateralVelocity: 0,
  playerOffsetX: 0,
  medianTimer: 0,
  distance: 0,
  gameOver: false,
  started: false,
  time: 0,
  difficulty: 1,
  topSpeedReached: 0,
  isBraking: false,
  explosionTime: 0,
  shakeTime: 0,
  shoulderTimer: 0,
  shoulderRightTimer: 0,
  onGuardrail: false,
};

// ═══════════════════════════════════════════════════════════
// THREE SETUP
// ═══════════════════════════════════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0e4c3);
scene.fog = new THREE.Fog(0xf5d8bc, 70, 520);

const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 600);
camera.position.set(0, 7, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;
document.body.prepend(renderer.domElement);

// ═══════════════════════════════════════════════════════════
// LIGHTS — Golden Hour Tuscany
// ═══════════════════════════════════════════════════════════
const ambient = new THREE.AmbientLight(0xeadaaf, 0.36);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0xffd8b0, 0x766246, 0.5);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffd2a0, 1.35);
sun.position.set(-45, 38, 24);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 200;
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x99b0d0, 0.24);
fill.position.set(32, 24, -30);
scene.add(fill);

// ═══════════════════════════════════════════════════════════
// TUSCANY TERRAIN — Rolling hills + agricultural fields
// ═══════════════════════════════════════════════════════════

const ROAD_LEFT = -12;
const ROAD_RIGHT = 24;

function isRoad(x) {
  return x > ROAD_LEFT && x < ROAD_RIGHT;
}

// Shoulder/explosion timing (seconds)
const SHOULDER_LIMIT = 1.2;

// Multi-octave hill height — rolling Tuscan hills with broad valleys
function hillHeight(x, z) {
  const edge = 1 + Math.max(0, Math.abs(x) - 28) * 0.06;
  return (
    (Math.sin(x * 0.0035 + z * 0.0022) * 10.0 +
     Math.sin(x * 0.007 - z * 0.005) * 5.6 +
     Math.cos(x * 0.0022 + z * 0.004) * 7.4 +
     Math.sin(z * 0.0028 + x * 0.0014) * 6.2 +
     Math.cos(x * 0.0065 - z * 0.0036) * 4.0 +
     Math.sin(x * 0.014 + z * 0.012) * 2.0 +
     Math.cos(x * 0.010 - z * 0.016) * 1.6 +
     Math.sin(x * 0.026 + z * 0.022) * 0.9) * edge
  );
}

function terrainHeight(x, z) {
  if (isRoad(x)) return -0.5;
  const dLeft = Math.max(0, ROAD_LEFT - x);
  const dRight = Math.max(0, x - ROAD_RIGHT);
  const d = Math.min(dLeft, dRight);
  const blend = Math.min(Math.pow(d / 14, 1.2), 1);
  const h = hillHeight(x, z);
  return -0.5 + (h + 0.5) * blend;
}

// Rich Tuscan field palette — 12 colors, larger patches
const FIELD_COLORS = [
  new THREE.Color(0xd9bd60), new THREE.Color(0x8ca55a),
  new THREE.Color(0x6f8a43), new THREE.Color(0xc38a43),
  new THREE.Color(0x9a6a36), new THREE.Color(0x7b944f),
  new THREE.Color(0xcc9f56), new THREE.Color(0x90af52),
  new THREE.Color(0xe0c572), new THREE.Color(0x5f7a38),
  new THREE.Color(0xb98c4a), new THREE.Color(0x869066),
];

function getFieldColor(x, z) {
  const cx = Math.floor(x / 28);
  const cz = Math.floor(z / 28);
  const h = (cx * 7919 + cz * 6271 + 1234) >>> 0;
  return FIELD_COLORS[h % FIELD_COLORS.length];
}

function fieldIsWheat(x, z) {
  const cx = Math.floor(x / 28);
  const cz = Math.floor(z / 28);
  const h = (cx * 7919 + cz * 6271 + 1234) >>> 0;
  const i = h % FIELD_COLORS.length;
  return i === 0 || i === 6 || i === 8 || i === 10;
}

function fieldIsGreen(x, z) {
  const cx = Math.floor(x / 28);
  const cz = Math.floor(z / 28);
  const h = (cx * 7919 + cz * 6271 + 1234) >>> 0;
  const i = h % FIELD_COLORS.length;
  return i === 1 || i === 2 || i === 5 || i === 9 || i === 11;
}

// Terrain chunk — wider, more segments
const T_W = 220, T_L = 110, T_SW = 88, T_SL = 28, T_NUM = 10;
const terrainChunks = [];

function createTerrainChunk() {
  const pos = [], col = [], uv = [], idx = [];
  for (let iz = 0; iz <= T_SL; iz++) {
    const z = (iz / T_SL) * T_L - T_L / 2;
    for (let ix = 0; ix <= T_SW; ix++) {
      const x = (ix / T_SW) * T_W - T_W / 2;
      const y = terrainHeight(x, z);
      pos.push(x, y, z);
      const c = getFieldColor(x, z);
      col.push(c.r, c.g, c.b);
      uv.push(ix / T_SW, iz / T_SL);
    }
  }
  for (let iz = 0; iz < T_SL; iz++)
    for (let ix = 0; ix < T_SW; ix++) {
      const a = iz * (T_SW + 1) + ix;
      idx.push(a, a + T_SW + 1, a + 1, a + 1, a + T_SW + 1, a + T_SW + 2);
    }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.92, metalness: 0, flatShading: false,
  }));
  m.receiveShadow = true;
  return m;
}

for (let i = 0; i < T_NUM; i++) {
  const c = createTerrainChunk();
  c.position.z = -i * T_L;
  scene.add(c);
  terrainChunks.push(c);
}

// ── Road group on top of terrain ──
const roadGroup = new THREE.Group();
scene.add(roadGroup);

// ═══════════════════════════════════════════════════════════
// ROAD — 5 lanes player side
// ═══════════════════════════════════════════════════════════
const roadMat = new THREE.MeshStandardMaterial({ color: 0x55585d, roughness: 0.82, metalness: 0 });
function createAsphaltTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#3d4147';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 24000; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const alpha = Math.random() * 0.05;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(x, y, Math.random() * 1.4, 1);
  }
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * size;

  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(18, 18);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const markings = [];
const MARKING_COUNT = 50;
const MARKING_LEN = 3;
const MARKING_GAP = 5;
const MARKING_PERIOD = MARKING_LEN + MARKING_GAP;
const markMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.4 });
const markGeo = new THREE.PlaneGeometry(0.2, MARKING_LEN);

function makeMarkings(offsets, center = 0) {
  for (let i = 0; i < MARKING_COUNT; i++) {
    const zp = -i * MARKING_PERIOD - MARKING_LEN / 2;
    for (const ox of offsets) {
      const m = new THREE.Mesh(markGeo, markMat);
      m.rotation.x = -Math.PI / 2;
      m.position.set(center + ox, 0.015, zp);
      roadGroup.add(m);
      markings.push(m);
    }
  }
}

  amber: new THREE.MeshStandardMaterial({ color: 0xff8800, emissive: 0xff6600, emissiveIntensity: 1.0 }),
};

function p(color) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.5 });
}

function detailedWheel(g, x, z, scale) {
  scale = scale || 1;
  const s = scale;
  const tireW = 0.16 * s;
  const tireR1 = 0.18 * s;
  const tireR2 = 0.22 * s;
  const rimR = 0.11 * s;
  const yPos = 0.09 * s;

  const tire = new THREE.Mesh(new THREE.CylinderGeometry(tireR1, tireR2, tireW, 8), _m.tire);
  tire.rotation.x = Math.PI / 2;
  tire.position.set(x, yPos, z);
  g.add(tire);

  const rimBarrel = new THREE.Mesh(new THREE.CylinderGeometry(rimR, rimR, tireW + 0.01, 8), _m.rim);
  rimBarrel.rotation.x = Math.PI / 2;
  rimBarrel.position.set(x, yPos, z);
  g.add(rimBarrel);

  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.025 * s, 0.02 * s, rimR * 0.80), _m.rim);
    spoke.position.set(x + Math.sin(angle) * rimR * 0.48, yPos, z + Math.cos(angle) * rimR * 0.48);
    spoke.rotation.y = -angle;
    g.add(spoke);
  }

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.035 * s, 0.035 * s, tireW + 0.02, 8), _m.hub);
  hub.rotation.x = Math.PI / 2;
  hub.position.set(x, yPos, z);
  g.add(hub);

  const lip = new THREE.Mesh(new THREE.TorusGeometry(rimR + 0.01 * s, 0.01 * s, 6, 10), _m.chrome);
  lip.rotation.x = Math.PI / 2;
  lip.position.set(x, yPos, z);
  g.add(lip);

  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    const lug = new THREE.Mesh(new THREE.CylinderGeometry(0.008 * s, 0.008 * s, 0.02 * s, 6), _m.chrome);
    lug.rotation.x = Math.PI / 2;
    lug.position.set(x + Math.sin(angle) * 0.020 * s, yPos + 0.01 * s, z + Math.cos(angle) * 0.020 * s);
    g.add(lug);
  }
}

function detailedWheel2(g, x1, x2, z, s) {
  detailedWheel(g, x1, z, s);
  detailedWheel(g, x2, z, s);
}

    tank.position.set(sx * 0.55, 0.18, 0.0);

  // ═══ TRAILER ═══
  const trlLen = doubleTrailer ? 3.8 : 5.5;

  const ltrim = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.06, trlLen), frameMat);

  // Trailer roof edge
  const rEdge = new THREE.Mesh(new THREE.BoxGeometry(2.05, 0.04, trlLen), frameMat);
  rEdge.position.set(0, 1.77, trlZ);
  g.add(rEdge);

  // Trailer rear doors
  for (const dx of [-1, 1]) {
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.6, 0.04), doorMat);

  // Trailer door hinges
  for (const dx of [-1, 1]) {
    for (let i = 0; i < 3; i++) {

  // Rear reflectors
  for (const rx of [-1, 1]) {

  // ═══ SECOND TRAILER (double) ═══
  if (doubleTrailer) {

    const t2z = trlZ + trlLen / 2 + 0.6 + t2Len / 2;

    const t2 = new THREE.Mesh(new THREE.BoxGeometry(2.05, 1.75, t2Len), trlMat);

    for (const dx of [-1, 1]) {
      const door = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.6, 0.04), doorMat);
      door.position.set(dx * 0.5, 0.92, t2z + t2Len / 2);

    for (const rx of [-1, 1]) {
      const ref = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.08, 0.04), refMat);
      ref.position.set(rx * 0.7, 0.3, t2z + t2Len / 2 + 0.02);

  }

  // ═══ WHEELS ═══
  function truckWheel(g, x, z) {
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.35, 0.22, 8), _m.tire);
    tire.rotation.x = Math.PI / 2;
    tire.position.set(x, 0.18, z);
    g.add(tire);

    const rimBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.23, 8), _m.rim);
    rimBarrel.rotation.x = Math.PI / 2;
    rimBarrel.position.set(x, 0.18, z);
    g.add(rimBarrel);

    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2;
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.025, 0.12), _m.rim);
      spoke.position.set(x + Math.sin(angle) * 0.08, 0.18, z + Math.cos(angle) * 0.08);
      spoke.rotation.y = -angle;
      g.add(spoke);
    }

    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.24, 8), _m.hub);
    hub.rotation.x = Math.PI / 2;
    hub.position.set(x, 0.18, z);

    const lip = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.015, 6, 10), _m.chrome);
    lip.rotation.x = Math.PI / 2;
    lip.position.set(x, 0.18, z);
    g.add(lip);

    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2;
      const lug = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.025, 6), _m.chrome);
      lug.rotation.x = Math.PI / 2;
      lug.position.set(x + Math.sin(angle) * 0.035, 0.19, z + Math.cos(angle) * 0.035);
      g.add(lug);
    }
  }

  function truckDualWheels(g, x, z) {
    for (const wOff of [-0.08, 0.08]) {
      const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.35, 0.10, 8), _m.tire);
      tire.rotation.x = Math.PI / 2;
      tire.position.set(x + wOff, 0.18, z);
      g.add(tire);
    }
    const rimBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.24, 8), _m.rim);
    rimBarrel.rotation.x = Math.PI / 2;
    rimBarrel.position.set(x, 0.18, z);
    g.add(rimBarrel);

    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2;
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.025, 0.12), _m.rim);
      spoke.position.set(x + Math.sin(angle) * 0.08, 0.18, z + Math.cos(angle) * 0.08);
      spoke.rotation.y = -angle;
      g.add(spoke);
    }

    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.25, 8), _m.hub);
    hub.rotation.x = Math.PI / 2;
    hub.position.set(x, 0.18, z);
    g.add(hub);
  }

  // Front wheels
  truckWheel(g, -0.8, -2.1); truckWheel(g, 0.8, -2.1);

  // Rear wheels (dual per side)
  const tPos = doubleTrailer
    ? [[-0.85, -0.4], [0.85, -0.4], [-0.85, 0.5], [0.85, 0.5],
       [-0.85, 2.5], [0.85, 2.5], [-0.85, 3.5], [0.85, 3.5]]
    : [[-0.85, -0.2], [0.85, -0.2], [-0.85, 1.0], [0.85, 1.0],
       [-0.85, 2.4], [0.85, 2.4]];

  for (const [wx, wz] of tPos) {
    truckDualWheels(g, wx, wz);
  }

  // ═══ FENDERS ═══
  // Front fenders
  for (const sx of [-1, 1]) {
    const ff = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.8), cabMat);
    ff.position.set(sx * 0.9, 0.3, -2.1);

  // Rear fenders (over trailer wheels)
  for (const sx of [-1, 1]) {
    const rf = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 1.2), _m.dark);
    rf.position.set(sx * 0.9, 0.35, 1.0);
    g.add(rf);
  }

  g.userData.isDoubleTrailer = doubleTrailer;
  return g;
}

// TRAFFIC SYSTEM — faster and spaced out
// ═══════════════════════════════════════════════════════════
const npcs = [];
const npcColors = [0x2244aa, 0x449944, 0xaaaa44, 0x8844aa, 0xaa4444, 0x4488aa, 0x888888, 0xeeeeee, 0x222222];

function getVehicleSize(vehicle) {
  return vehicle.userData.isTruck
    ? { len: TRUCK_LENGTH, wid: TRUCK_WIDTH }
    : { len: CAR_LENGTH, wid: CAR_WIDTH };
}

function hasMinGap(z, lane, minGap, laneShift) {
  for (const v of npcs) {
    const vShift = v.userData.laneShift || 0;
    const vLane = v.userData.laneIdx;
    const vEffectiveX = PLAYER_LANES[vLane] + vShift;
    const thisX = PLAYER_LANES[lane] + (laneShift || 0);
    if (Math.abs(vEffectiveX - thisX) < 2.8 && Math.abs(v.userData.trackZ - z) < minGap * 0.7) return false;
  }
  return true;
}

function createCar(color, variant) {
  switch (variant) {
    case 'sedan': return createSedan(color);
    case 'sports': return createMuscle(color);
    default: return createPickup(color);
  }
}

function spawnVehicle() {
  const laneIdx = Math.floor(Math.random() * 5);
  const isTruck = Math.random() < 0.10;
  // Some cars sit between lanes — shifts 1.5-2.2 units toward adjacent lane
  let laneShift = 0;
  if (!isTruck && Math.random() < 0.35) {
    const dir = laneIdx === 0 ? 1 : laneIdx === 4 ? -1 : Math.random() < 0.5 ? 1 : -1;
    laneShift = dir * (1.5 + Math.random() * 0.7);
  }
  const x = PLAYER_LANES[laneIdx] + laneShift;
  const minGap = isTruck ? 45 : 30;

  const z = SPAWN_Z - Math.random() * 180;
  if (!hasMinGap(z, laneIdx, minGap, laneShift)) return;

  let vehicle;
  if (isTruck) {
    vehicle = createTruck();
  } else {
    const typeRoll = Math.random();
    const variant = typeRoll < 0.28 ? 'sports' : typeRoll < 0.68 ? 'sedan' : 'normal';
    vehicle = createCar(npcColors[Math.floor(Math.random() * npcColors.length)], variant);
  }
  vehicle.position.set(x, 0, z);
  // Headlights
  for (const hx of [-0.4, 0.4]) {
    const hl = new THREE.PointLight(0xaaccff, 6, 18);
    hl.position.set(hx, 0.2, -2.0);
    vehicle.add(hl);
  }
  vehicle.userData = {
    laneIdx,
    trackZ: z,
    isTruck,
    laneShift,
  };
  scene.add(vehicle);
  npcs.push(vehicle);
}

function despawnVehicle(v) {
  scene.remove(v);
  const idx = npcs.indexOf(v);
  if (idx > -1) npcs.splice(idx, 1);
}

for (let i = 0; i < 15; i++) spawnVehicle();

// ── ITALIAN CYPRESS ──
const cypresses = [];

function createCypress(x, z, h) {
  const g = new THREE.Group();
  // Tronco entortado e natural
  const trunkH = 0.35 + h * 0.16;
  const trunkCurve = (Math.random() - 0.5) * 0.15;
  for (let i = 0; i < 4; i++) {
    const segH = trunkH / 4;
    const r1 = 0.022 * h * (1 - i * 0.15);
    const r2 = r1 * 0.85;
    const twist = Math.sin(i * 0.7 + trunkCurve) * 0.08;
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, segH, 8), vegMat.pineTrunk);
    seg.position.y = i * segH + segH / 2;
    seg.rotation.z = twist;
    seg.rotation.x = (Math.random() - 0.5) * 0.02;
    g.add(seg);
  }
  // Foliagem em múltiplas camadas cônicas
  const materials = [vegMat.cypressDark, vegMat.cypress, vegMat.cypressLight, vegMat.cypressGray];
  const nLayers = 5 + Math.floor(h * 2.5);
  for (let i = 0; i < nLayers; i++) {
    const t = i / nLayers;
    const matLayer = materials[Math.floor(Math.random() * materials.length)];
    const baseR = (0.018 + (1 - t) * 0.048) * h;
    const r = baseR * (0.9 + Math.random() * 0.2);
    const segH = h * (0.35 + Math.random() * 0.25 / nLayers);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r * 0.7, segH, 14), matLayer);
    cone.position.y = trunkH * 0.5 + t * h * 0.8 + (Math.random() - 0.5) * 0.04;
    cone.position.x = (Math.random() - 0.5) * 0.08 * h;
    cone.position.z = (Math.random() - 0.5) * 0.08 * h;
    cone.rotation.z = Math.sin(i * 0.5 + x * 0.01) * 0.06;
    cone.rotation.x = (Math.random() - 0.5) * 0.04;
    g.add(cone);
    // Pequenos detalhes na lateral
    if (Math.random() < 0.3) {
      const detail = new THREE.Mesh(new THREE.SphereGeometry(r * 0.15, 6, 5), matLayer);
      const angle = Math.random() * Math.PI * 2;
      detail.position.set(Math.cos(angle) * r * 0.8, cone.position.y, Math.sin(angle) * r * 0.8);
      detail.scale.set(0.8 + Math.random() * 0.4, 0.7, 0.8 + Math.random() * 0.4);
      g.add(detail);
    }
  }
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.008 * h, 0.14 * h, 12), vegMat.cypressDark);
  tip.position.y = trunkH * 0.5 + h * 0.95;
  g.add(tip);
  g.position.set(x, terrainHeight(x, z), z);
  g.rotation.y = Math.random() * Math.PI * 2;
  g.rotation.z = (Math.random() - 0.5) * 0.02;
  g.rotation.x = (Math.random() - 0.5) * 0.02;
  return g;
}

// ── UMBRELLA PINE ──
const pines = [];

function createPine(x, z, s) {
  const g = new THREE.Group();
  const trunkH = 0.35 * s;
  // Tronco com textura
  const pTrunkMats = [vegMat.pineTrunk, vegMat.pineTrunkDark];
  for (let i = 0; i < 5; i++) {
    const segH = trunkH / 5;
    const r1 = 0.028 * s * (1 - i * 0.12);
    const r2 = r1 * 0.88;
    const trunkMat = pTrunkMats[Math.floor(Math.random() * pTrunkMats.length)];
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, segH, 7), trunkMat);
    seg.position.y = i * segH + segH / 2;
    seg.rotation.z = Math.sin(i * 0.4) * 0.04;
    g.add(seg);
  }
  // Copa guarda-chuva com múltiplas camadas
  const pineMats = [vegMat.pine, vegMat.pineDark, vegMat.pineLight];
  const nRings = 6 + Math.floor(Math.random() * 2);
  for (let i = 0; i < nRings; i++) {
    const t = i / nRings;
    const r = (0.38 - t * 0.14) * s * (0.85 + Math.random() * 0.3);
    const nSegments = 12 + Math.floor(r * 20);
    const lH = (0.028 + Math.random() * 0.022) * s;
    const pineMat = pineMats[Math.floor(Math.random() * pineMats.length)];
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.1, r, lH, nSegments), pineMat);
    ring.position.y = trunkH * 0.4 + t * trunkH * 0.45;
    ring.position.x = (Math.random() - 0.5) * 0.06 * s;
    ring.position.z = (Math.random() - 0.5) * 0.06 * s;
    ring.rotation.z = (Math.random() - 0.5) * 0.08;
    g.add(ring);
  }
  // Dome plano no topo
  const domeMat = pineMats[Math.floor(Math.random() * pineMats.length)];
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.18 * s * (0.95 + Math.random() * 0.15), 14, 8), domeMat);
  dome.position.y = trunkH * 0.5 + trunkH * 0.4;
  dome.scale.y = 0.22 + Math.random() * 0.08;
  dome.scale.x = 1.0 + Math.random() * 0.15;
  dome.scale.z = 1.0 + Math.random() * 0.15;
  g.add(dome);
  g.position.set(x, terrainHeight(x, z), z);
  g.rotation.y = Math.random() * Math.PI * 2;
  g.rotation.z = (Math.random() - 0.5) * 0.02;
  g.rotation.x = (Math.random() - 0.5) * 0.02;
  return g;
}

// ── OLIVE TREE — gnarled trunk + silvery-green foliage ──
const olives = [];

function createOlive(x, z, s) {
  const g = new THREE.Group();
  const tilt = 0.08 + Math.random() * 0.1;
  // Tronco gnarled com múltiplos segmentos
  const trunkMats = [vegMat.oliveTrunk, vegMat.oliveTrunkLight];
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + (Math.random() - 0.5) * 0.8;
    const offR = 0.014 * s * (0.6 + Math.random() * 0.6);
    const segH = 0.16 * s;
    const twist = Math.sin(i * 1.2) * 0.25;
    const trunkMat = trunkMats[Math.floor(Math.random() * trunkMats.length)];
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.018 * s, 0.025 * s, segH, 7), trunkMat);
    seg.position.set(Math.cos(a) * offR, 0.06 * s + i * 0.08 * s, Math.sin(a) * offR);
    seg.rotation.z = twist + (Math.random() - 0.5) * 0.3;
    seg.rotation.x = (Math.random() - 0.5) * 0.3;
    g.add(seg);
  }
  // Tronco central
  const mainTrunkMat = trunkMats[Math.floor(Math.random() * trunkMats.length)];
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.028 * s, 0.038 * s, 0.38 * s, 7), mainTrunkMat);
  trunk.position.y = 0.18 * s;
  trunk.rotation.z = (Math.random() - 0.5) * tilt;
  trunk.rotation.x = (Math.random() - 0.5) * tilt;
  g.add(trunk);
  // Copa múltipla de foliagem
  const leafMaterials = [vegMat.oliveLeaf, vegMat.oliveLeafLight, vegMat.oliveLeafDark];
  const nBalls = 40 + Math.floor(Math.random() * 30);
  for (let i = 0; i < nBalls; i++) {
    const a = Math.random() * Math.PI * 2;
    const elev = Math.random() * Math.PI;
    const r = (0.05 + Math.random() * 0.18) * s;
    const h = 0.15 * s + Math.random() * 0.35 * s;
    const lr = (0.035 + Math.random() * 0.06) * s;
    const ballMat = leafMaterials[Math.floor(Math.random() * leafMaterials.length)];
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(lr, 7, 6), ballMat);
    leaf.position.set(
      Math.cos(a) * Math.sin(elev) * r * (0.7 + Math.random() * 0.6),
      h + (Math.random() - 0.5) * 0.1 * s,
      Math.sin(a) * Math.sin(elev) * r * (0.7 + Math.random() * 0.6)
    );
    leaf.scale.set(0.7 + Math.random() * 0.6, 0.5 + Math.random() * 0.6, 0.7 + Math.random() * 0.6);
    leaf.rotation.set(Math.random() * 0.4, Math.random() * Math.PI * 2, Math.random() * 0.4);
    g.add(leaf);
  }
  // Núcleo central para densidade
  const coreMat = leafMaterials[Math.floor(Math.random() * leafMaterials.length)];
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.12 * s * (0.8 + Math.random() * 0.4), 10, 8), coreMat);
  core.position.y = (0.32 + Math.random() * 0.1) * s;
  core.scale.set(0.85 + Math.random() * 0.3, 0.55 + Math.random() * 0.25, 0.85 + Math.random() * 0.3);
  g.add(core);
  g.position.set(x, terrainHeight(x, z), z);
  g.rotation.y = Math.random() * Math.PI * 2;
  g.rotation.z = (Math.random() - 0.5) * tilt;
  g.rotation.x = (Math.random() - 0.5) * tilt;
  return g;
}

const bushes = [];

function createBush(x, z, s) {

    const elevBase = 0.15 * s + Math.random() * 0.2 * s;
    const r = (0.07 + Math.random() * 0.12) * s;
    const lobeSize = (0.08 + Math.random() * 0.08) * s;
    const lobeMat = materials[Math.floor(Math.random() * materials.length)];
    const lobe = new THREE.Mesh(new THREE.SphereGeometry(lobeSize, 8, 7), lobeMat);
    lobe.position.set(
      Math.cos(a) * r * (0.6 + Math.random() * 0.5),
      elevBase + (Math.random() - 0.5) * 0.08 * s,
      Math.sin(a) * r * (0.6 + Math.random() * 0.5)
    );
    lobe.scale.set(0.6 + Math.random() * 0.8, 0.6 + Math.random() * 0.6, 0.6 + Math.random() * 0.8);
    lobe.rotation.set(Math.random() * 0.4, Math.random() * Math.PI * 2, Math.random() * 0.4);
    g.add(lobe);
    // Pequenos sub-lobes
    if (Math.random() < 0.4) {
      const subMat = materials[Math.floor(Math.random() * materials.length)];
      const subLobe = new THREE.Mesh(new THREE.SphereGeometry(lobeSize * 0.5, 7, 6), subMat);
      subLobe.position.set(
        lobe.position.x + (Math.random() - 0.5) * 0.08 * s,
        lobe.position.y + (Math.random() - 0.5) * 0.06 * s,
        lobe.position.z + (Math.random() - 0.5) * 0.08 * s
      );
      subLobe.scale.set(0.5 + Math.random() * 0.4, 0.5 + Math.random() * 0.4, 0.5 + Math.random() * 0.4);
      g.add(subLobe);
    }
  }
  // Núcleo central
  const coreMat = materials[Math.floor(Math.random() * materials.length)];
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.07 * s, 8, 7), coreMat);
  core.position.y = 0.12 * s + Math.random() * 0.08 * s;
  core.scale.set(0.7 + Math.random() * 0.3, 0.8 + Math.random() * 0.3, 0.7 + Math.random() * 0.3);
  g.add(core);
  g.position.set(x, terrainHeight(x, z), z);
  return g;
}

// ── ROCKS ──
const rocks = [];

function createRock(x, z, s) {
  const g = new THREE.Group();
  const rockMaterials = [
    new THREE.MeshStandardMaterial({ color: 0x8a6a43, roughness: 0.96, metalness: 0 }),
    new THREE.MeshStandardMaterial({ color: 0x9a7a53, roughness: 0.97, metalness: 0 }),
    new THREE.MeshStandardMaterial({ color: 0x7a5a33, roughness: 0.95, metalness: 0 }),
  ];
  const n = 4 + Math.floor(Math.random() * 6);
  for (let i = 0; i < n; i++) {
    const sz = 0.04 * s * (0.5 + Math.random() * 0.9);
    const geomType = Math.random();
    let rockGeo;
    if (geomType < 0.4) {
      rockGeo = new THREE.DodecahedronGeometry(sz, 1);
    } else if (geomType < 0.7) {
      rockGeo = new THREE.IcosahedronGeometry(sz, 1);
    } else {
      rockGeo = new THREE.TetrahedronGeometry(sz, 0);
    }
    const rockMat = rockMaterials[Math.floor(Math.random() * rockMaterials.length)];
    const rock = new THREE.Mesh(rockGeo, rockMat);
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.07 * s;
    rock.position.set(Math.cos(a) * r + (Math.random() - 0.5) * 0.04 * s, sz * 0.3 + (Math.random() - 0.5) * 0.01 * s, Math.sin(a) * r + (Math.random() - 0.5) * 0.04 * s);
    rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    rock.scale.set(0.8 + Math.random() * 0.4, 0.9 + Math.random() * 0.3, 0.8 + Math.random() * 0.4);
    g.add(rock);
  }
  g.position.set(x, terrainHeight(x, z), z);
  return g;
}

// ── PLACE VEGETATION ──
function placeVegetation() {
  for (let z = VEG_SPAWN_Z; z < 160; z += 3.6) {
    // ── Cypress along road edges ──
    if (Math.random() < 0.28) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const x = side * (24 + Math.random() * 14);
      if (!isRoad(x)) {
        const h = 1.8 + Math.random() * 2.2;
        const t = createCypress(x, z + Math.random() * 3.5, h);
        scene.add(t);
        cypresses.push(t);
      }
    }
    // ── Cypress groups and vineyard rows ──
    if (Math.random() < 0.12) {
      const cx = (Math.random() < 0.5 ? -1 : 1) * (26 + Math.random() * 20);
      if (!isRoad(cx)) {
        const n = 2 + Math.floor(Math.random() * 4);
        for (let i = 0; i < n; i++) {
          const h = 1.7 + Math.random() * 2.4;
          const t = createCypress(cx + (Math.random() - 0.5) * 8, z + Math.random() * 6.5, h);
          scene.add(t);
          cypresses.push(t);
        }
      }
    }
    // ── Olive trees and groves ──
    if (Math.random() < 0.14) {
      const x = (Math.random() < 0.5 ? -1 : 1) * (30 + Math.random() * 50);
      if (!isRoad(x) && fieldIsGreen(x, z)) {
        const o = createOlive(x, z + Math.random() * 6.5, 3.5 + Math.random() * 3.3);
        scene.add(o);
        olives.push(o);
      }
    }
    // ── Wheat and grain patches ──
    if (Math.random() < 0.22) {
      const x = (Math.random() - 0.5) * 230;
      if (!isRoad(x) && fieldIsWheat(x, z)) {
        const w = createWheat(x, z + Math.random() * 5.5, 4.5 + Math.random() * 4.5);
        scene.add(w);
        wheats.push(w);
      }
    }
    // ── Pasture grass patches ──
    if (Math.random() < 0.2) {
      const x = (Math.random() - 0.5) * 235;
      if (!isRoad(x) && fieldIsGreen(x, z)) {
        const p = createPasture(x, z + Math.random() * 4.2, 1.0 + Math.random() * 1.3);
        scene.add(p);
        pastures.push(p);
      }
    }
    // ── Umbrella pines on ridgelines ──
    if (Math.random() < 0.06) {
      const x = (Math.random() < 0.5 ? -1 : 1) * (34 + Math.random() * 62);
      if (!isRoad(x)) {
        const p = createPine(x, z + Math.random() * 8.5, 6.5 + Math.random() * 8.5);
        scene.add(p);
        pines.push(p);
      }
    }
    // ── Scrub bushes and orchard undergrowth ──
    if (Math.random() < 0.3) {
      const x = (Math.random() - 0.5) * 230;
      if (!isRoad(x)) {
        const b = createBush(x, z + Math.random() * 5.5, 1.0 + Math.random() * 1.7);
        scene.add(b);
        bushes.push(b);
      }
    }
    // ── Rocks along the slopes ──
    if (Math.random() < 0.14) {
      const x = (Math.random() - 0.5) * 230;
      if (!isRoad(x)) {
        const r = createRock(x, z + Math.random() * 7.5, 2.0 + Math.random() * 3.2);
        scene.add(r);
        rocks.push(r);
      }
    }
  }
}

// CONTROLS
// ═══════════════════════════════════════════════════════════════════
const keys = {};

const audioContext = new (window.AudioContext || window.webkitAudioContext)();
let engineOsc, engineGain, engineFilter, rumbleGain, engineHarmonic, harmGain, engineNoise, noiseGain, engineOsc2, osc2Gain;
let explosionLight;
const explosionParticles = [];

function initAudio() {
  if (engineOsc) return;

  // Layer 1: Main cylinder bank — sawtooth at fundamental RPM
  engineOsc = audioContext.createOscillator();
  engineFilter = audioContext.createBiquadFilter();
  engineFilter.type = 'lowpass';
  engineFilter.frequency.value = 90;
  engineFilter.Q.value = 1.0;
  engineGain = audioContext.createGain();
  engineGain.gain.value = 0.02;
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 50;
  engineOsc.connect(engineFilter);
  engineFilter.connect(engineGain);
  engineGain.connect(audioContext.destination);
  engineOsc.start();

  // Layer 2: Secondary cylinder — slightly detuned for multi-cylinder chorus
  engineOsc2 = audioContext.createOscillator();
  const filter2 = audioContext.createBiquadFilter();
  filter2.type = 'lowpass';
  filter2.frequency.value = 200;
  filter2.Q.value = 0.8;
  osc2Gain = audioContext.createGain();
  osc2Gain.gain.value = 0.008;
  engineOsc2.type = 'sawtooth';
  engineOsc2.frequency.value = 50.8;
  engineOsc2.connect(filter2);
  filter2.connect(osc2Gain);
  osc2Gain.connect(audioContext.destination);
  engineOsc2.start();

  // Layer 3: Exhaust harmonics — square at 2x RPM for "brap" character
  engineHarmonic = audioContext.createOscillator();
  const harmFilter = audioContext.createBiquadFilter();
  harmFilter.type = 'lowpass';
  harmFilter.frequency.value = 800;
  harmFilter.Q.value = 0.5;
  harmGain = audioContext.createGain();
  harmGain.gain.value = 0.01;
  engineHarmonic.type = 'square';
  engineHarmonic.frequency.value = 100;
  engineHarmonic.connect(harmFilter);
  harmFilter.connect(harmGain);
  harmGain.connect(audioContext.destination);
  engineHarmonic.start();

  // Layer 4: Exhaust noise — filtered noise for airflow texture
  engineNoise = audioContext.createBufferSource();
  const noiseLen = audioContext.sampleRate * 2;
  const noiseBuf = audioContext.createBuffer(1, noiseLen, audioContext.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) {
    nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nd.length, 0.3);
  }
  engineNoise.buffer = noiseBuf;
  engineNoise.loop = true;
  const noiseFilter = audioContext.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = 400;
  noiseFilter.Q.value = 0.7;
  noiseGain = audioContext.createGain();
  noiseGain.gain.value = 0.002;
  engineNoise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(audioContext.destination);
  engineNoise.start();

  // Layer 5: Sub rumble — chassis vibration
  rumbleGain = audioContext.createGain();
  rumbleGain.gain.value = 0.02;
  const rumble = audioContext.createOscillator();
  rumble.type = 'sine';
  rumble.frequency.value = 25;
  rumble.connect(rumbleGain);
  rumbleGain.connect(audioContext.destination);
  rumble.start();
}

function stopEngine() {
  if (engineGain) engineGain.gain.value = 0;
  if (osc2Gain) osc2Gain.gain.value = 0;
  if (harmGain) harmGain.gain.value = 0;
  if (noiseGain) noiseGain.gain.value = 0;
  if (rumbleGain) rumbleGain.gain.value = 0;
}

function unlockAudio() {
  if (audioContext.state === 'suspended') audioContext.resume();
  initAudio();
}

document.body.addEventListener('click', unlockAudio, { once: true });
document.body.addEventListener('keydown', unlockAudio, { once: true });

function playExplosionSound(gasoline) {
  if (audioContext.state === 'suspended') audioContext.resume();
  initAudio();
  if (!gasoline) return;
  const t0 = audioContext.currentTime;

  // Layer 1: Sub-boom (deep 20-60Hz)
  const sub = audioContext.createOscillator();
  const subGain = audioContext.createGain();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(60, t0);
  sub.frequency.exponentialRampToValueAtTime(18, t0 + 1.0);
  subGain.gain.setValueAtTime(1.0, t0);
  subGain.gain.exponentialRampToValueAtTime(0.001, t0 + 1.0);
  sub.connect(subGain);
  subGain.connect(audioContext.destination);
  sub.start(t0); sub.stop(t0 + 1.0);

  // Layer 2: Broadband explosion noise (crackle → rumble)
  const duration = 1.8;
  const buffer = audioContext.createBuffer(1, audioContext.sampleRate * duration, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    const t = i / data.length;
    const env = t < 0.08
      ? Math.pow(1 - t / 0.08, 1.2) * 1.8
      : Math.pow(1 - t, 2) * 0.7;
    data[i] = (Math.random() * 2 - 1) * env * (0.7 + Math.random() * 0.6);
  }
  const noise = audioContext.createBufferSource();
  noise.buffer = buffer;
  const noiseGain = audioContext.createGain();
  noiseGain.gain.setValueAtTime(1.0, t0);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  const hp = audioContext.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.setValueAtTime(20, t0);
  hp.frequency.linearRampToValueAtTime(1200, t0 + 0.04);
  hp.frequency.exponentialRampToValueAtTime(30, t0 + duration);
  const lp = audioContext.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(8000, t0);
  lp.frequency.exponentialRampToValueAtTime(250, t0 + duration);
  noise.connect(hp); hp.connect(lp);
  lp.connect(noiseGain); noiseGain.connect(audioContext.destination);
  noise.start(t0); noise.stop(t0 + duration);

  // Layer 3: Secondary gasoline ignition (200ms delay)
  setTimeout(() => {
    if (audioContext.state === 'suspended') return;
    const t2 = audioContext.currentTime;
    const boom2 = audioContext.createOscillator();
    const gain2 = audioContext.createGain();
    boom2.type = 'sawtooth';
    boom2.frequency.setValueAtTime(70, t2);
    boom2.frequency.exponentialRampToValueAtTime(15, t2 + 0.6);
    gain2.gain.setValueAtTime(0.6, t2);
    gain2.gain.exponentialRampToValueAtTime(0.001, t2 + 0.6);
    boom2.connect(gain2);
    gain2.connect(audioContext.destination);
    boom2.start(t2); boom2.stop(t2 + 0.6);
  }, 200);

  // Layer 4: Metal shrapnel rattle (100ms delay)
  setTimeout(() => {
    if (audioContext.state === 'suspended') return;
    const t1 = audioContext.currentTime;
    const dur = 0.25;
    const buf = audioContext.createBuffer(1, audioContext.sampleRate * dur, audioContext.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4) * 0.4;
    }
    const src = audioContext.createBufferSource();
    src.buffer = buf;
    const g = audioContext.createGain();
    g.gain.setValueAtTime(0.25, t1);
    g.gain.exponentialRampToValueAtTime(0.001, t1 + dur);
    const bp = audioContext.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 2500; bp.Q.value = 3;
    src.connect(bp); bp.connect(g); g.connect(audioContext.destination);
    src.start(t1);
  }, 100);
}

function createExplosion(origin, gasoline) {
  if (!explosionLight) {
    explosionLight = new THREE.PointLight(0xff6600, 60, 100, 1.5);
    explosionLight.position.set(origin.x, origin.y + 2, origin.z);
    scene.add(explosionLight);
  }
  explosionLight.position.copy(origin).add(new THREE.Vector3(0, 3, 0));
  explosionLight.intensity = 80;
  explosionLight.color.setHex(0xff8800);
  S.explosionTime = 1.2;
  S.shakeTime = 1.2;
  playExplosionSound(gasoline);
  if (!gasoline) return;

  const oY = origin.y;

  // ── FIREBALL (expanding emissive sphere) ──
  const fbMat = new THREE.MeshStandardMaterial({
    color: 0xff8800, emissive: 0xff4400, emissiveIntensity: 3,
    transparent: true, opacity: 1,
  });
  const fireball = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), fbMat);
  fireball.position.copy(origin).add(new THREE.Vector3(0, 0.5, 0));
  fireball.userData = { expandRate: 5, maxScale: 3.5 + Math.random(), fireball: true };
  scene.add(fireball);
  explosionParticles.push({ mesh: fireball, velocity: new THREE.Vector3(0, 1, 0), life: 1.0 });

  // ── SHRAPNEL (angular debris that tumbles) ──
  const sc = [0x444444, 0x333333, 0x555555, 0x443300, 0x332200];
  for (let i = 0; i < 50; i++) {
    const size = 0.08 + Math.random() * 0.22 + (Math.random() < 0.15 ? 0.3 : 0);
    let geo;
    const r = Math.random();
    if (r < 0.35) geo = new THREE.IcosahedronGeometry(size, 0);
    else if (r < 0.65) geo = new THREE.DodecahedronGeometry(size, 0);
    else if (r < 0.85) geo = new THREE.BoxGeometry(size * 1.4, size * 0.7, size * 0.7);
    else geo = new THREE.TorusKnotGeometry(size * 0.6, size * 0.3, 4, 3);
    const mat = new THREE.MeshStandardMaterial({
      color: sc[Math.floor(Math.random() * sc.length)],
      emissive: Math.random() < 0.25 ? 0xff4400 : 0x000000,
      emissiveIntensity: Math.random() < 0.25 ? 0.6 : 0,
      metalness: 0.5, roughness: 0.6,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(origin).add(new THREE.Vector3(
      (Math.random() - 0.5) * 3, Math.random() * 2, (Math.random() - 0.5) * 3
    ));
    const speed = 7 + Math.random() * 20;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 0.75 + 0.1;
    const vel = new THREE.Vector3(
      Math.cos(theta) * Math.sin(phi) * speed,
      Math.cos(phi) * speed * 0.9,
      Math.sin(theta) * Math.sin(phi) * speed
    );
    const ang = new THREE.Vector3(
      (Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12
    );
    scene.add(mesh);
    explosionParticles.push({ mesh, velocity: vel, angularVel: ang, life: 1.8 + Math.random() * 2.0, shrapnel: true });
  }

  // ── SPARKS (small bright, fast streak) ──
  for (let i = 0; i < 60; i++) {
    const size = 0.04 + Math.random() * 0.07;
    const mat = new THREE.MeshStandardMaterial({
      color: 0xffcc00, emissive: 0xff8800, emissiveIntensity: 3,
    });
    const spark = new THREE.Mesh(new THREE.SphereGeometry(size, 4, 4), mat);
    spark.position.copy(origin).add(new THREE.Vector3(
      (Math.random() - 0.5) * 2, Math.random() * 1.5, (Math.random() - 0.5) * 2
    ));
    const speed = 15 + Math.random() * 30;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 0.5 + 0.15;
    const vel = new THREE.Vector3(
      Math.cos(theta) * Math.sin(phi) * speed,
      Math.cos(phi) * speed,
      Math.sin(theta) * Math.sin(phi) * speed
    );
    scene.add(spark);
    explosionParticles.push({ mesh: spark, velocity: vel, life: 0.3 + Math.random() * 0.5, spark: true });
  }

  // ── SMOKE (billowing dark clouds) ──
  for (let i = 0; i < 25; i++) {
    const size = 1.0 + Math.random() * 1.5;
    const mat = new THREE.MeshStandardMaterial({
      color: 0x1a1a1a, emissive: 0x111111,
      transparent: true, opacity: 0.3 + Math.random() * 0.3,
    });
    const puff = new THREE.Mesh(new THREE.SphereGeometry(size, 7, 7), mat);
    puff.position.copy(origin).add(new THREE.Vector3(
      (Math.random() - 0.5) * 3, Math.random() * 1.5, (Math.random() - 0.5) * 3
    ));
    const vel = new THREE.Vector3(
      (Math.random() - 0.5) * 1.5, 4 + Math.random() * 6, (Math.random() - 0.5) * 1.5
    );
    scene.add(puff);
    explosionParticles.push({ mesh: puff, velocity: vel, life: 2.5 + Math.random() * 2.0, smoke: true });
  }

  // ── GROUND FIRE POOLS ──
  for (let i = 0; i < 35; i++) {
    const mat = new THREE.MeshStandardMaterial({
      color: 0xff4400, emissive: 0xff2200, emissiveIntensity: 1.5,
      transparent: true, opacity: 0.6 + Math.random() * 0.3,
    });
    const disc = new THREE.Mesh(new THREE.CircleGeometry(0.2 + Math.random() * 0.5, 6), mat);
    const a = Math.random() * Math.PI * 2;
    const r = 0.5 + Math.random() * 4;
    disc.position.copy(origin).add(new THREE.Vector3(Math.cos(a) * r, 0.02, Math.sin(a) * r));
    disc.rotation.x = -Math.PI / 2;
    scene.add(disc);
    explosionParticles.push({ mesh: disc, velocity: new THREE.Vector3(0, 0.3 + Math.random() * 0.5, 0), life: 1.0 + Math.random() * 1.2, groundfire: true });
  }
}

function updateExplosions(dt) {
  if (S.explosionTime > 0) {
    S.explosionTime -= dt;
    if (explosionLight) {
      explosionLight.intensity = Math.max(0, S.explosionTime * 70);
      explosionLight.color.setHSL(0.08 - S.explosionTime * 0.05, 1, 0.5);
    }
  }
  for (let i = explosionParticles.length - 1; i >= 0; i--) {
    const p = explosionParticles[i];
    p.mesh.position.addScaledVector(p.velocity, dt);

    if (p.mesh.userData && p.mesh.userData.fireball) {
      const scale = p.mesh.scale.x + dt * p.mesh.userData.expandRate;
      if (scale < p.mesh.userData.maxScale) p.mesh.scale.setScalar(scale);
      const fade = Math.max(0, p.life / 1.0);
      p.mesh.material.opacity = Math.min(1, fade * 1.5);
      p.mesh.material.emissiveIntensity = fade * 3;
      p.velocity.y += 1.5 * dt;
    } else if (p.shrapnel) {
      p.velocity.y -= 14 * dt;
      if (p.angularVel) {
        p.mesh.rotation.x += p.angularVel.x * dt;
        p.mesh.rotation.y += p.angularVel.y * dt;
        p.mesh.rotation.z += p.angularVel.z * dt;
      }
    } else if (p.spark) {
      p.velocity.y -= 10 * dt;
      const fade = Math.max(0, p.life / 0.5);
      p.mesh.scale.setScalar(fade);
    } else if (p.smoke) {
      p.velocity.y += 2.5 * dt;
      p.velocity.multiplyScalar(1 - dt * 0.25);
      p.mesh.scale.addScalar(dt * 1.8);
      p.mesh.material.opacity = Math.max(0, (p.life / 4) * 0.35);
    } else if (p.groundfire) {
      p.mesh.material.opacity = Math.max(0, p.life * 0.6);
      p.mesh.scale.addScalar(dt * 0.4);
    }

    p.life -= dt;
    if (p.life <= 0 || p.mesh.position.y < -5) {
      scene.remove(p.mesh);
      explosionParticles.splice(i, 1);
    }
  }
}

    e.preventDefault();
    if (!S.started) startGame();
    else if (S.gameOver) resetGame();
  }
});

document.querySelectorAll('#mobile-controls .mc-btn').forEach(btn => {
  const key = btn.dataset.key;
  function press() { btn.classList.add('pressed'); document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true })); }
  function release() { btn.classList.remove('pressed'); document.dispatchEvent(new KeyboardEvent('keyup', { key, bubbles: true })); }
  btn.addEventListener('touchstart', e => { e.preventDefault(); unlockAudio(); press(); });
  btn.addEventListener('touchend', e => { e.preventDefault(); release(); });
  btn.addEventListener('touchcancel', e => { e.preventDefault(); release(); });
  btn.addEventListener('mousedown', e => { e.preventDefault(); press(); });
  btn.addEventListener('mouseup', e => { e.preventDefault(); release(); });
  btn.addEventListener('mouseleave', () => { btn.classList.remove('pressed'); document.dispatchEvent(new KeyboardEvent('keyup', { key, bubbles: true })); });
});
