  start() {
    if (this.on) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.on = true;
    this.masterGain.gain.value = this.volume;
    this.station = Math.min(this.station, this.stations.length - 1);
    this.loadTrack();
    this.scheduleInterval();
  }

  stop() {
    this.on = false;
    this.masterGain.gain.value = 0;
    if (this.sequencer) { clearInterval(this.sequencer); this.sequencer = null; }
    this.step = 0; this.bar = 0;
  }

  toggle() { this.on ? this.stop() : this.start(); }

  nextStation() {
    this.station = (this.station + 1) % this.stations.length;
    this.transitioning = true;
    setTimeout(() => { this.transitioning = false; this.loadTrack(); }, 300);
  }

  prevStation() {
    this.station = (this.station - 1 + this.stations.length) % this.stations.length;
    this.transitioning = true;
    setTimeout(() => { this.transitioning = false; this.loadTrack(); }, 300);
  }

  setVolume(v) { this.volume = Math.max(0, Math.min(1, v)); if (this.on) this.masterGain.gain.value = this.volume; }
  volUp() { this.setVolume(this.volume + 0.08); }
  volDown() { this.setVolume(this.volume - 0.08); }

  loadTrack() {
    const s = this.stations[this.station];
    this.tracks = s.tracks;
    this.trackIdx = Math.floor(Math.random() * this.tracks.length);
    const t = this.tracks[this.trackIdx];
    this.stationName = s.name;
    this.trackName = t.name;
    this._nextChord = 0;
    if (this.updateUI) this.updateUI();
    this.bar = 0;
  }

  nextTrack() {
    this.trackIdx = (this.trackIdx + 1) % this.tracks.length;
    const t = this.tracks[this.trackIdx];
    this.trackName = t.name;
    this._nextChord = 0;
    if (this.updateUI) this.updateUI();
    this.bar = 0;
  }

  scheduleInterval() {
    if (this.sequencer) clearInterval(this.sequencer);
    const bpm = this.stations[this.station].bpm;
    const stepMs = 60000 / bpm / 4;
    this.step = 0; this.bar = 0;
    this.sequencer = setInterval(() => this.playStep(), stepMs);
  }

  playStep() {
    if (!this.on || this.ctx.state === 'suspended') return;
    const s = this.stations[this.station];
    const t = this.tracks[this.trackIdx];
    const pat = s.getPattern(this.trackIdx);
    const step = this.step;
    const nextBar = step === 0;

    if (nextBar) {
      this.bar = (this.bar + 1) % 8;
      if (this.bar === 0 && Math.random() < 0.2) this.nextTrack();
    }

    // Chord change every 4 steps
    if (step % 4 === 0) {
      const p = t.prog;
      const totalBeats = p.chords.reduce((a,c)=>a+c.d, 0);
      const beat = this._nextChord % totalBeats;
      let acc = 0;
      for (const chord of p.chords) {
        acc += chord.d;
        if (beat < acc) {
          this._currentChord = chord;
          this._chordRoot = p.root;
          break;
        }
      }
      this._nextChord++;
    }

    // ── Drums ──
    if (pat.kicks[step]) this.deepKick();
    if (pat.snares[step]) this.snare();
    if (pat.hats[step]) this.hat(false);
    if (pat.htOpen[step]) this.hat(true);

    // ── Bass ──
    if (pat.bassSeq[step]) {
      const root = this._chordRoot || -3;
      const offs = [0, -2, -3, -5];
      this.subBass(root + offs[Math.floor(Math.random() * offs.length)]);
    }

    // ── Harmonic layers ──
    if (pat.rhodes && step % 8 === 0) this.rhodesChord(this._currentChord, this._chordRoot);
    if (pat.strings && step === 0) this.stringsPad(this._currentChord, this._chordRoot);
    if (pat.mafiaPiano && step % 8 === 0) this.mafiaPiano(this._chordRoot);
    if (pat.mafiaTrumpet && step % 16 === 0 && Math.random() < 0.4) this.mafiaTrumpet(this._chordRoot);
    if (pat.menace && step % 16 === 0) this.menaceDrone(this._chordRoot);
    if (pat.bell && step % 8 === 0 && Math.random() < 0.2) this.bellPluck(this._chordRoot, step);
    if (pat.darkPad && step === 0) this.darkPad(this._currentChord, this._chordRoot);
    if (pat.cinematicStrings && step % 32 === 0) this.cinematicStrings(this._currentChord, this._chordRoot);
    if (pat.darkGuitar && step % 12 === 0 && Math.random() < 0.15) this.darkGuitar(this._chordRoot);
    if (pat.soulSample && step % 16 === 0 && Math.random() < 0.2) this.soulSample(this._chordRoot);
    if (pat.vocalChop && step % 8 === 0 && Math.random() < 0.08) this.vocalChop(this._chordRoot);

    // ── Atmosphere ──
    if (pat.rain && step % 16 === 0 && Math.random() < 0.1) this.rainAmbience();
    if (pat.distantSiren && step === 0 && Math.random() < 0.04) this.distantSiren();

    // ── Effects ──
    if (Math.random() < 0.018) this.gunCock();
    if (pat.scratch && Math.random() < pat.scratch * 0.06) this.scratch();
    if (pat.vinyl && Math.random() < 0.06) this.vinylCrackle();
    if (pat.policeRadio && step % 16 === 0 && Math.random() < 0.12) this.policeRadio();

    this.step = (step + 1) % 16;
  }

  // ═══════════════════════════════════════════════════════
  // SOUND GENERATORS — Mafia Cinematic Engine
  // ═══════════════════════════════════════════════════════

  deepKick() {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const osc1 = ctx.createOscillator(); const gain1 = ctx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(150 * (0.85+Math.random()*0.3), t0);
    osc1.frequency.exponentialRampToValueAtTime(30, t0 + 0.12);
    gain1.gain.setValueAtTime(0.85 * (0.85+Math.random()*0.3), t0);
    gain1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 200;
    osc1.connect(filter); filter.connect(gain1); gain1.connect(this.busGain);
    osc1.start(t0); osc1.stop(t0 + 0.4);

    const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(60, t0);
    osc2.frequency.exponentialRampToValueAtTime(20, t0 + 0.2);
    gain2.gain.setValueAtTime(0.7, t0);
    gain2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
    const sub = ctx.createBiquadFilter();
    sub.type = 'lowpass'; sub.frequency.value = 80;
    osc2.connect(sub); sub.connect(gain2); gain2.connect(this.busGain);
    osc2.start(t0); osc2.stop(t0 + 0.35);

    // Dist/click for attack
    const click = ctx.createBuffer(1, ctx.sampleRate * 0.005, ctx.sampleRate);
    const cd = click.getChannelData(0);
    for (let i = 0; i < cd.length; i++) cd[i] = Math.pow(1 - i/cd.length, 8) * 0.6;
    const cSrc = ctx.createBufferSource();
    cSrc.buffer = click;
    const cGain = ctx.createGain();
    cGain.gain.setValueAtTime(0.4, t0);
    cGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.008);
    cSrc.connect(cGain); cGain.connect(this.busGain);
    cSrc.start(t0);
  }

  snare() {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / data.length;
      data[i] = (Math.random()*2-1) * Math.pow(1-t, 1.2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.55*(0.85+Math.random()*0.3), t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 600;
    noise.connect(hp); hp.connect(gain); gain.connect(this.busGain);
    noise.start(t0); noise.stop(t0 + 0.15);

    const tone = ctx.createOscillator(); const toneG = ctx.createGain();
    tone.type = 'triangle';
    tone.frequency.setValueAtTime(200, t0);
    tone.frequency.linearRampToValueAtTime(160, t0 + 0.08);
    toneG.gain.setValueAtTime(0.3, t0);
    toneG.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
    const snareLp = ctx.createBiquadFilter();
    snareLp.type = 'lowpass'; snareLp.frequency.value = 3000;
    tone.connect(snareLp); snareLp.connect(toneG); toneG.connect(this.busGain);
    tone.start(t0); tone.stop(t0 + 0.09);
  }

  hat(open) {
    const ctx = this.ctx;
    const dur = open ? 0.10 : 0.03;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random()*2-1) * Math.pow(1-i/data.length, open ? 1.5 : 5);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.10*(0.7+Math.random()*0.6), ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 8000;
    src.connect(hp); hp.connect(gain); gain.connect(this.busGain);
    src.start(); src.stop(ctx.currentTime + dur);
  }

  subBass(note) {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const freq = 180 * Math.pow(2, note / 12);
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.35 * (0.85+Math.random()*0.3), t0);
    gain.gain.linearRampToValueAtTime(0.18, t0 + 0.04);
    gain.gain.linearRampToValueAtTime(0.12, t0 + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.32);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 100;
    osc.connect(lp); lp.connect(gain); gain.connect(this.busGain);
    osc.start(t0); osc.stop(t0 + 0.35);
  }

  rhodesChord(chord, root) {
    if (!chord) return;
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const intervals = chord.t;
    for (const intv of intervals) {
      const freq = 200 * Math.pow(2, (root + intv) / 12);
      for (let v = 0; v < 2; v++) {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq * (v === 0 ? 1 : 2.01);
        osc.detune.value = (Math.random()-0.5) * 3;
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.linearRampToValueAtTime(0.04*(1-v*0.3), t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04);
        gain.gain.setValueAtTime(0.001, t0 + 0.05);
        gain.gain.linearRampToValueAtTime(0.03*(1-v*0.3), t0 + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 1600 + Math.random() * 400; lp.Q.value = 0.8;
        osc.connect(lp); lp.connect(gain); gain.connect(this.busGain);
        osc.start(t0); osc.stop(t0 + 1.5);
      }
    }
  }

  stringsPad(chord, root) {
    if (!chord) return;
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const intervals = chord.t;
    for (const intv of intervals) {
      const freq = 200 * Math.pow(2, (root + intv + 12) / 12);
      for (let v = 0; v < 3; v++) {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = freq * (1 + (v-1) * 0.003);
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.linearRampToValueAtTime(0.025, t0 + 0.5);
        gain.gain.linearRampToValueAtTime(0.001, t0 + 3.5);
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 800; lp.Q.value = 1.5;
        osc.connect(lp); lp.connect(gain); gain.connect(this.busGain);
        osc.start(t0); osc.stop(t0 + 4.0);
      }
    }
  }

  menaceDrone(root) {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const freq = 110 * Math.pow(2, ((root || -3) + 0) / 12);
    for (let v = 0; v < 2; v++) {
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = v === 0 ? 'sawtooth' : 'square';
      osc.frequency.value = freq * (v === 0 ? 1 : 0.5);
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(0.015 - v * 0.005, t0 + 0.3);
      gain.gain.setValueAtTime(0.015 - v * 0.005, t0 + 1.5);
      gain.gain.linearRampToValueAtTime(0.001, t0 + 2.5);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 400 - v * 150; lp.Q.value = 2;
      osc.connect(lp); lp.connect(gain); gain.connect(this.busGain);
      osc.start(t0); osc.stop(t0 + 3.0);
    }
  }

  bellPluck(root, step) {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const notes = [0, -3, -5, -7, -2, -8];
    const n = notes[step % notes.length];
    const freq = 880 * Math.pow(2, ((root || -3) + n) / 12);
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.03, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 2;
    osc.connect(bp); bp.connect(gain); gain.connect(this.busGain);
    osc.start(t0); osc.stop(t0 + 0.8);
  }

  scratch() {
    const ctx = this.ctx;
    const dur = 0.06 + Math.random() * 0.05;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random()*2-1) * Math.sin(i/data.length * Math.PI * (5 + Math.random()*10)) * (1 - i/data.length);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    const t0 = ctx.currentTime;
    gain.gain.setValueAtTime(0.05, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 2500;
    src.connect(hp); hp.connect(gain); gain.connect(this.busGain);
    src.start(t0); src.stop(t0 + dur);
  }

  vinylCrackle() {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const dur = 0.01 + Math.random() * 0.02;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random()*2-1) * Math.pow(1-i/data.length, 2) * 0.3;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.02, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 3000 + Math.random() * 3000; bp.Q.value = 1;
    src.connect(bp); bp.connect(gain); gain.connect(this.busGain);
    src.start(t0); src.stop(t0 + dur);
  }

  mafiaPiano(root) {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const melodies = [
      [-5,-3,-2,0,-2,-3,-5,-3,-2,0,2,0,-2,-3,-5,-3],
      [-7,-5,-3,-2,-3,-5,-7,-5,-3,-2,0,-2,-3,-5,-7,-5],
      [-3,-2,0,2,0,-2,-3,-2,0,2,3,2,0,-2,-3,-5],
    ];
    const mel = melodies[Math.floor(Math.random() * melodies.length)];
    const idx = Math.floor(Math.random() * 12);
    const base = (root || -3) + mel[idx];
    const freq = 220 * Math.pow(2, base / 12);
    for (let v = 0; v < 3; v++) {
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = v === 2 ? 'triangle' : 'sine';
      osc.frequency.value = freq * (1 + (v-1) * 0.004);
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(0.07 - v * 0.018, t0 + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.015, t0 + 0.08);
      gain.gain.linearRampToValueAtTime(0.001, t0 + 0.6);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 1200 + v * 400; lp.Q.value = 0.8;
      osc.connect(lp); lp.connect(gain); gain.connect(this.busGain);
      osc.start(t0); osc.stop(t0 + 1.0);
    }
  }

  mafiaTrumpet(root) {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const phrases = [
      [-3,0,2,3,5,3,2,0,-2,-3],
      [-5,-3,0,2,0,-3,-2,0,-3,-5],
      [0,2,3,5,7,5,3,2,0,-2],
    ];
    const phrase = phrases[Math.floor(Math.random() * phrases.length)];
    const n = phrase[Math.floor(Math.random() * phrase.length)];
    const freq = 440 * Math.pow(2, ((root || -3) + n) / 12);
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, t0);
    gain.gain.linearRampToValueAtTime(0.045, t0 + 0.03);
    gain.gain.linearRampToValueAtTime(0.008, t0 + 0.3);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 1.0);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 800 + Math.random() * 300; bp.Q.value = 1.8;
    const delay = ctx.createDelay(0.4);
    delay.delayTime.value = 0.18;
    const feedback = ctx.createGain();
    feedback.gain.value = 0.3;
    osc.connect(bp); bp.connect(gain);
    gain.connect(this.busGain);
    gain.connect(delay); delay.connect(feedback);
    feedback.connect(delay); feedback.connect(this.busGain);
    osc.start(t0); osc.stop(t0 + 1.2);
  }

  // ═══ NEW GENERATORS — Dark Cinematic ═══

  darkPad(chord, root) {
    if (!chord) return;
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const intervals = chord.t;
    for (const intv of intervals) {
      const freq = 110 * Math.pow(2, (root + intv) / 12);
      for (let v = 0; v < 2; v++) {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = freq * (1 + v * 0.005);
        osc.detune.value = (Math.random() - 0.5) * 5;
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.linearRampToValueAtTime(0.018 - v * 0.005, t0 + 0.6);
        gain.gain.linearRampToValueAtTime(0.001, t0 + 4.0);
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 500 - v * 150; lp.Q.value = 2.5;
        osc.connect(lp); lp.connect(gain); gain.connect(this.busGain);
        osc.start(t0); osc.stop(t0 + 4.5);
      }
    }
  }

  cinematicStrings(chord, root) {
    if (!chord) return;
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const intervals = chord.t;
    const noteCount = Math.min(intervals.length, 4);
    for (let i = 0; i < noteCount; i++) {
      const intv = intervals[i];
      const freq = 440 * Math.pow(2, (root + intv + 12) / 12);
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      osc.detune.value = (Math.random() - 0.5) * 3;
      const startOffset = i * 0.03;
      gain.gain.setValueAtTime(0.001, t0 + startOffset);
      gain.gain.linearRampToValueAtTime(0.025 - i * 0.003, t0 + 0.2 + startOffset);
      gain.gain.setValueAtTime(0.025 - i * 0.003, t0 + 1.5);
      gain.gain.linearRampToValueAtTime(0.001, t0 + 3.0);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 1200 - i * 150; lp.Q.value = 1.2;
      const reverbDelay = ctx.createDelay(0.5);
      reverbDelay.delayTime.value = 0.25 + i * 0.02;
      const fb = ctx.createGain();
      fb.gain.value = 0.2;
      osc.connect(lp); lp.connect(gain);
      gain.connect(this.busGain);
      gain.connect(reverbDelay); reverbDelay.connect(fb);
      fb.connect(reverbDelay); fb.connect(this.busGain);
      osc.start(t0 + startOffset); osc.stop(t0 + 3.5 + startOffset);
    }
  }

  darkGuitar(root) {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const notes = [0, -3, -2, -5, -7, -3];
    const n = notes[Math.floor(Math.random() * notes.length)];
    const freq = 330 * Math.pow(2, ((root || -3) + n) / 12);
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, t0);
    gain.gain.linearRampToValueAtTime(0.02, t0 + 0.005);
    gain.gain.linearRampToValueAtTime(0.008, t0 + 0.15);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 1.5);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = freq * 2; bp.Q.value = 1.5;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2000;
    osc.connect(bp); bp.connect(lp); lp.connect(gain);
    gain.connect(this.busGain);
    const delay = ctx.createDelay(0.6);
    delay.delayTime.value = 0.35;
    const fb = ctx.createGain();
    fb.gain.value = 0.15;
    gain.connect(delay); delay.connect(fb);
    fb.connect(delay); fb.connect(this.busGain);
    osc.start(t0); osc.stop(t0 + 2.0);
  }

  soulSample(root) {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const notes = [0, 2, -3, -2, 0, -5];
    const n = notes[Math.floor(Math.random() * notes.length)];
    const freq = 350 * Math.pow(2, ((root || -3) + n) / 12);
    // Two oscillators for chorus effect
    for (let v = 0; v < 2; v++) {
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = v === 0 ? 'sawtooth' : 'triangle';
      osc.frequency.value = freq * (1 + v * 0.003);
      osc.detune.value = (Math.random() - 0.5) * 6;
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(0.015 - v * 0.005, t0 + 0.01);
      gain.gain.linearRampToValueAtTime(0.005, t0 + 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 1200 - v * 300;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 300;
      osc.connect(hp); hp.connect(lp); lp.connect(gain);
      gain.connect(this.busGain);
      osc.start(t0); osc.stop(t0 + 1.5);
    }
  }

  vocalChop(root) {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const freq = 600 * Math.pow(2, ((root || -3) + Math.floor(Math.random() * 5 - 2)) / 12);
    const dur = 0.06 + Math.random() * 0.08;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / data.length;
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2) * Math.sin(t * 20 * Math.PI) * 0.5;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.03, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 3;
    const delay = ctx.createDelay(0.3);
    delay.delayTime.value = 0.12;
    const fb = ctx.createGain();
    fb.gain.value = 0.25;
    src.connect(bp); bp.connect(gain);
    gain.connect(this.busGain);
    gain.connect(delay); delay.connect(fb);
    fb.connect(delay); fb.connect(this.busGain);
    src.start(t0); src.stop(t0 + dur);
  }

  rainAmbience() {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const dur = 0.3 + Math.random() * 0.5;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 0.5) * 0.2;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.015, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 4000;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 12000;
    src.connect(hp); hp.connect(lp); lp.connect(gain);
    gain.connect(this.busGain);
    src.start(t0); src.stop(t0 + dur);
  }

  distantSiren() {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const dur = 0.6 + Math.random() * 0.4;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / data.length;
      const freq = 800 + Math.sin(t * Math.PI * 4) * 300;
      data[i] = Math.sin(t * dur * freq) * Math.pow(1 - t, 2) * 0.08;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.004, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1500;
    src.connect(lp); lp.connect(gain); gain.connect(this.busGain);
    src.start(t0); src.stop(t0 + dur);
  }

  policeRadio() {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const dur = 0.08 + Math.random() * 0.06;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / data.length;
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3) * Math.sin(t * 30 * Math.PI) * 0.15;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.005, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 600 + Math.random() * 400; bp.Q.value = 4;
    src.connect(bp); bp.connect(gain); gain.connect(this.busGain);
    src.start(t0); src.stop(t0 + dur);
  }


  gunCock() {
    const ctx = this.ctx; const t0 = ctx.currentTime;
    const dur = 0.04;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random()*2-1) * Math.pow(1-i/data.length, 0.3);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.025, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 3000;
    src.connect(hp); hp.connect(gain); gain.connect(this.busGain);
    src.start(t0); src.stop(t0 + dur);
  }
}

  S.playerOffsetX = 0;

// COLLISION
// ═══════════════════════════════════════════════════════════
function checkCollision(a, aType, b, bType) {
  const aS = aType === 'truck' ? { l: TRUCK_LENGTH, w: TRUCK_WIDTH } : { l: CAR_LENGTH, w: CAR_WIDTH };
  const bS = bType === 'truck' ? { l: TRUCK_LENGTH, w: TRUCK_WIDTH } : { l: CAR_LENGTH, w: CAR_WIDTH };
  const dx = Math.abs(a.x - b.x);
  const dz = Math.abs(a.z - b.z);
  return dx < (aS.w + bS.w) * 0.42 && dz < (aS.l + bS.l) * 0.42;
}

function doGameOver() {
  S.gameOver = true;
  S.started = false;
  stopEngine();

  // Save records if improved
  let newRecord = false;
  const kmh = Math.round(S.topSpeedReached * 3.2);
  if (S.time > saveData.bestTime) { saveData.bestTime = S.time; newRecord = true; }
  if (S.distance > saveData.bestDistance) { saveData.bestDistance = S.distance; newRecord = true; }
  if (S.topSpeedReached > saveData.topSpeed) { saveData.topSpeed = S.topSpeedReached; newRecord = true; }
  if (newRecord) saveProgress(saveData);

  const overlay = document.getElementById('overlay');
  const content = document.getElementById('overlay-content');
  const dist = (S.distance / 1000).toFixed(1);
  const timeStr = formatTime(S.time);
  let html = '';
  if (newRecord) html += '<div class="rec-new-record">★ NEW RECORD ★</div>';
  html += '<div class="final-score">STRECKE: ' + dist + ' km</div>';
  html += '<div class="final-detail">HÖCHSTGESCHWINDIGKEIT: ' + kmh + ' km/h</div>';
  html += '<div class="final-detail">FAHRZEIT: ' + timeStr + '</div>';
  html += '<div class="prompt" id="restart-btn">SPACE ZUM NEUSTART</div>';
  content.innerHTML = html;
  document.getElementById('restart-btn').addEventListener('click', resetGame);
  overlay.classList.remove('hidden');
  // Refresh records in the records section above
  refreshRecords();
}

function triggerPlayerExplosion() {
  if (S.gameOver) return;
  // hide player mesh so explosion visuals are clean
  try { playerCar.visible = false; } catch (e) {}
  createExplosion(playerCar.position, true);
  doGameOver();
}

// ═══════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════
const clock = new THREE.Clock();
const speedDisplay = document.getElementById('speed-display');
const gearDisplay = document.getElementById('gear-display');
const distDisplay = document.getElementById('dist-display');
const brakeIndicator = document.getElementById('brake-indicator');
const speedLimitEl = document.getElementById('speed-limit');

// Shoulder timer HUD elements
const shoulderTimerEl = document.getElementById('shoulder-timer');
const shoulderTimerBadge = document.getElementById('shoulder-timer-badge');

function worldToScreen(pos, camera, renderer) {
  const vector = pos.clone();
  vector.project(camera);
  const halfW = renderer.domElement.clientWidth / 2;
  const halfH = renderer.domElement.clientHeight / 2;
  return {
    x: (vector.x * halfW) + halfW + renderer.domElement.getBoundingClientRect().left,
    y: (-vector.y * halfH) + halfH + renderer.domElement.getBoundingClientRect().top,
    visible: vector.z < 1 && vector.z > -1
  };
}

let cameraLean = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (S.started && !S.gameOver) {
    S.time += dt;
    S.difficulty = 1 + S.time / 90;

    // ── Speed & Brakes ──
    let accel = 0;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) accel += 32;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) accel -= 32;

    // Aerodynamic drag — quadratic, simulates air resistance
    S.speed -= S.speed * S.speed * DRAG_COEFF * dt;

    if (accel < 0 && S.speed > MIN_SPEED) {
      // Braking
      S.isBraking = true;
      S.speed += accel * dt;
    } else {
      S.isBraking = false;
      if (accel > 0) {
        // Throttle: progressive acceleration curve
        const s = S.speed;
        let thrust;
        if (s < CRUISE_SPEED * 0.5) thrust = 32;           // 0–75 km/h: punchy
        else if (s < CRUISE_SPEED) thrust = 24;             // 75–150: strong pull
        else if (s < 68.75) thrust = 18;                    // 150–220: responsive
        else if (s < 87.5) thrust = 11;                     // 220–280: heavy
        else if (s < 109.375) thrust = 5.5;                 // 280–350: slow climb
        else thrust = 3;                                     // 350–400: extreme, brutal
        // Extra ramp near top speed for cinematic feel
        const taper = 1 - Math.max(0, (s - 87.5) / (MAX_SPEED - 87.5)) * 0.3;
        S.speed += thrust * taper * dt;
      } else {
        // Coasting: cruise control holds 150 km/h
        if (S.speed < CRUISE_SPEED) {
          // Accelerate toward cruise with drag feed-forward
          const dragComp = S.speed * S.speed * DRAG_COEFF;
          S.speed += (CRUISE_ACCEL + dragComp) * dt;
        } else if (S.speed > CRUISE_SPEED + 0.3) {
          // Gentle deceleration back to cruise
          S.speed -= CRUISE_DECEL * dt;
        } else {
          // Within ~1 km/h of cruise: compensate only drag
          const dragComp = S.speed * S.speed * DRAG_COEFF;
          S.speed += dragComp * dt;
        }
      }
    }

    S.speed = Math.max(MIN_SPEED, Math.min(MAX_SPEED, S.speed));
    if (S.speed > S.topSpeedReached) {
      S.topSpeedReached = S.speed;
      if (S.speed > saveData.topSpeed) { saveData.topSpeed = S.speed; saveProgress(saveData); }
    }
    if (engineOsc) {
      const speedNorm = S.speed / MAX_SPEED;
      const accelPos = accel > 0 ? accel : 0;
      const accelNeg = accel < 0 ? -accel : 0;
      const overrun = accelNeg > 0 && speedNorm < 0.4;
      // RPM: smooth catch-up with load-based target
      const rpmTarget = 50 + speedNorm * 170 + accelPos * 0.35;
      const rpm = engineOsc.frequency.value + (rpmTarget - engineOsc.frequency.value) * 0.06;
      engineOsc.frequency.value = rpm;
      // Secondary cylinder — detuned for realistic multi-cylinder chorus
      engineOsc2.frequency.value = rpm * 1.018;
      osc2Gain.gain.value = 0.006 + speedNorm * 0.014 + accelPos * 0.00006;
      // Exhaust harmonic (square at 2x RPM)
      engineHarmonic.frequency.value = rpm * 2.02;
      harmGain.gain.value = 0.004 + speedNorm * 0.018 + (accelPos > 0 ? accelPos * 0.00015 : 0);
      // Noise exhaust — filter opens with RPM for airflow
      if (noiseGain) {
        noiseGain.gain.value = 0.001 + speedNorm * 0.005 + accelPos * 0.00004;
      }
      // Filter: opens on acceleration, closes on decel
      const filterTarget = 80 + rpm * 6 + (accelPos > 0 ? 300 : 0) + (overrun ? -200 : 0);
      engineFilter.frequency.value += (filterTarget - engineFilter.frequency.value) * 0.07;
      // Main engine gain
      const gainTarget = 0.012 + speedNorm * 0.065 + accelPos * 0.0004;
      engineGain.gain.value += (gainTarget - engineGain.gain.value) * 0.07;
      // Sub rumble — deeper and stronger at high speed
      rumbleGain.gain.value = 0.01 + speedNorm * 0.04 + (overrun ? 0.03 : 0);
    }
    const trackPos = S.distance * 0.05;
    const track = getTrackState(trackPos);
    roadGroup.position.x = track.x;
    roadGroup.position.y = track.y;
    // Keep the road horizontal: remove banking rotation.
    roadGroup.rotation.z = 0;

    playerCar.position.y = track.y + PLAYER_CAR_RIDE_HEIGHT + Math.sin(S.time * 18) * 0.003 + Math.sin(S.time * 42) * 0.002;

    // Brake lights
    const brakeIntensity = S.isBraking ? 1.8 : 0.25;
    playerCar.children.forEach(child => {
      if (child.userData && child.userData.isTaillight) {
        child.material.emissiveIntensity = brakeIntensity;
      }
    });
    brakeIndicator.style.opacity = S.isBraking ? '1' : '0';

    speedLimitEl.style.opacity = S.speed > CRUISE_SPEED * 1.3 ? '1' : '0';

    // ── Free Steering — stable at speed, responsive at low ──
    let steerInput = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) steerInput = -1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) steerInput = 1;
    if (S.isBraking) steerInput *= 0.6;

    const speedNorm2 = S.speed / BASE_SPEED;
    const steerResponse = Math.max(4, 14 - speedNorm2 * 1.4);
    S.steerAngle += (steerInput - S.steerAngle) * steerResponse * dt;

    const lateralTarget = S.steerAngle * S.speed * 0.28;
    S.lateralVelocity += (lateralTarget - S.lateralVelocity) * dt * (6 + speedNorm2 * 2);
    S.playerOffsetX += S.lateralVelocity * dt;
    const OFF_LIMIT = 22;
    if (S.playerOffsetX < -OFF_LIMIT) {
      S.playerOffsetX = -OFF_LIMIT;
      S.lateralVelocity = 0;
    }
    if (S.playerOffsetX > OFF_LIMIT) {
      S.playerOffsetX = OFF_LIMIT;
      S.lateralVelocity = 0;
    }
    playerCar.position.x = track.x + S.playerOffsetX;

    // Prevent crossing the median into oncoming lanes
    const PLAYER_RIGHT_LIMIT = MEDIAN_X - 1.0; // keep at least ~1m clearance from median
    if (playerCar.position.x > PLAYER_RIGHT_LIMIT) {
      playerCar.position.x = PLAYER_RIGHT_LIMIT;
      S.playerOffsetX = PLAYER_RIGHT_LIMIT - track.x;
      S.lateralVelocity = 0;
    }

    // ── Off-road / shoulder check ──
    if (!S.gameOver) {
      const px = playerCar.position.x;
      if (px < -12 || px > 24) {
        // Instant death — drove off the road
        S.offroadTimer = 0;
        S.shoulderTimer = 0;
        S.shoulderRightTimer = 0;
        triggerPlayerExplosion();
      } else {
        // Left shoulder timer: SHOULDER_LIMIT continuous
        if (px > -12 && px < -8) {
          S.shoulderTimer = (S.shoulderTimer || 0) + dt;
          if (S.shoulderTimer >= SHOULDER_LIMIT) {
            S.shoulderTimer = 0;
            triggerPlayerExplosion();
          }
        } else {
          S.shoulderTimer = 0;
        }
        // Median (mureta) contact: SHOULDER_LIMIT continuous
        // Use the actual clamped right limit so timer increments when the player is pressed against the median
        const TOUCH_MEDIAN_THRESHOLD = 0.06;
        const touchingMedian = px >= (PLAYER_RIGHT_LIMIT - TOUCH_MEDIAN_THRESHOLD);
        if (touchingMedian) {
          S.medianTimer = (S.medianTimer || 0) + dt;
          if (S.medianTimer >= SHOULDER_LIMIT) {
            S.medianTimer = 0;
            triggerPlayerExplosion();
          }
        } else {
          S.medianTimer = 0;
        }
        // Right barrier (guardrail): SHOULDER_LIMIT continuous + heavy speed loss
        if (px > 20 && px < 24) {
          S.speed = Math.max(0, S.speed - 60 * dt);
          S.shoulderRightTimer = (S.shoulderRightTimer || 0) + dt;
          if (S.shoulderRightTimer >= SHOULDER_LIMIT) {
            S.shoulderRightTimer = 0;
            triggerPlayerExplosion();
          }
        } else {
          S.shoulderRightTimer = 0;
        }
      }
    }

    // Visual yaw — smooth, based on steer angle
    const targetYaw = -S.steerAngle * 0.02 * speedNorm2;
    playerCar.rotation.y += (targetYaw - playerCar.rotation.y) * dt * 6;

    // Body roll
    const targetRoll = -S.steerAngle * 0.06;
    playerCar.rotation.z += (targetRoll - playerCar.rotation.z) * dt * 10;

    cameraLean += (-S.steerAngle * 2.0 - cameraLean) * dt * 4;

    // ── Nose dive under braking ──
    const noseDive = S.isBraking ? 0.015 : 0;
    playerCar.rotation.x += (noseDive - playerCar.rotation.x) * dt * 8;

    // ── Distance ──
    S.distance += S.speed * dt * 0.6;

    // ── Camera ──
    const camTargetX = playerCar.position.x * 0.5 + cameraLean * 0.15;
    camera.position.x += (camTargetX - camera.position.x) * dt * 3.5;
    camera.position.y += ((7 + track.y * 0.35) - camera.position.y) * dt * 3.5;
    camera.position.z = 14 + Math.abs(playerCar.position.x) * 0.06;
    // FOV widens with speed for cinematic feel
    const fovTarget = 64 + (S.speed / MAX_SPEED) * 8;
    camera.fov += (fovTarget - camera.fov) * dt * 2;
    camera.updateProjectionMatrix();
    const lookX = playerCar.position.x * 0.3 + cameraLean * 0.3;
    const lookY = track.y - 0.3 + (S.isBraking ? 0.4 : 0);
    const lookZ = -4 - Math.abs(S.steerAngle) * 2;
    camera.lookAt(lookX, lookY, lookZ);

    // ── Shoulder timer badge update (project player position to screen)
    const shoulderTime = Math.max(S.shoulderTimer || 0, S.shoulderRightTimer || 0, S.medianTimer || 0);
    if (shoulderTime > 0) {
      const worldPos = playerCar.position.clone();
      // lift badge slightly above car
      worldPos.y += 1.2;
      const scr = worldToScreen(worldPos, camera, renderer);
      if (scr.visible) {
        shoulderTimerEl.style.display = 'block';
        shoulderTimerEl.style.left = (scr.x - 28) + 'px';
        shoulderTimerEl.style.top = (scr.y - 36) + 'px';
        const t = Math.min(shoulderTime, SHOULDER_LIMIT);
        shoulderTimerBadge.textContent = t.toFixed(1) + 's';
        // Visual pulse when near the limit
        if (t >= SHOULDER_LIMIT * 0.75) shoulderTimerBadge.style.boxShadow = '0 6px 18px rgba(255,80,60,0.6)';
        else shoulderTimerBadge.style.boxShadow = '0 4px 12px rgba(0,0,0,0.5)';
      } else {
        shoulderTimerEl.style.display = 'none';
      }
    } else {
      shoulderTimerEl.style.display = 'none';
    }

    // ── Scroll Speed ──
    const scrollSpeed = S.speed * dt;

    // Road markings
    for (const m of markings) {
      m.position.z += scrollSpeed;
      if (m.position.z > DESPAWN_Z) m.position.z -= MARKING_COUNT * MARKING_PERIOD;
    }

    // Median warning markers
    for (const w of warnMarkers) {
      w.position.z += scrollSpeed;
      if (w.position.z > 40) w.position.z -= 70 * 8.5;
    }

    // ── NPC Traffic ──
    for (let i = npcs.length - 1; i >= 0; i--) {
      const v = npcs[i];
      const npcSpeed = S.speed * 0.7;
      const deltaZ = Math.max(0, S.speed - npcSpeed) * dt;
      v.userData.trackZ += deltaZ;
      if (v.userData.trackZ > DESPAWN_Z + 20) {
        despawnVehicle(v);
        continue;
      }
      const laneX = PLAYER_LANES[v.userData.laneIdx] + (v.userData.laneShift || 0);
      const t = getTrackState(v.userData.trackZ + trackPos);
      v.position.set(t.x + laneX, t.y + NPC_CAR_RIDE_HEIGHT, v.userData.trackZ);
      if (v.userData.isTruck) v.rotation.y = 0;
    }
    while (npcs.length < 10 + S.difficulty * 2) {
      spawnVehicle();
    }

    // ── Terrain scroll ──
    for (const c of terrainChunks) {
      c.position.z += scrollSpeed;
      if (c.position.z > DESPAWN_Z + 60) c.position.z -= T_NUM * T_L;
    }

    // ── Vegetation scroll (Y follows hills every frame) ──
    function scrollVeg(arr, spawnZ, spread) {
      for (const v of arr) {
        v.position.z += scrollSpeed;
        v.position.y = terrainHeight(v.position.x, v.position.z);
        if (v.position.z > VEG_DESPAWN_Z) {
          v.position.z = spawnZ - Math.random() * spread;
          v.position.y = terrainHeight(v.position.x, v.position.z);
        }
      }
    }
    scrollVeg(cypresses, VEG_SPAWN_Z, 80);
    scrollVeg(pines, VEG_SPAWN_Z, 100);
    scrollVeg(olives, VEG_SPAWN_Z, 90);
    scrollVeg(wheats, VEG_SPAWN_Z, 100);
    scrollVeg(pastures, VEG_SPAWN_Z, 110);
    scrollVeg(bushes, VEG_SPAWN_Z, 120);
    scrollVeg(rocks, VEG_SPAWN_Z, 130);

    // ── Clouds drift ──
    for (const c of clouds) {
      c.position.z += scrollSpeed * 0.2;
      c.position.x += c.userData.speed * dt * 0.6;
      if (c.position.x > 180) c.position.x = -180;
      if (c.position.z > DESPAWN_Z + 50) c.position.z = VEG_SPAWN_Z;
    }

    // ── Collision Detection ──
    const pp = playerCar.position;
    for (const v of npcs) {
      const vType = v.userData.isTruck ? 'truck' : 'car';
      if (checkCollision(pp, 'car', v.position, vType)) {
        triggerPlayerExplosion();
        break;
      }
    }

    // ── HUD ──
    const kmh = Math.round(S.speed * 3.2);
    speedDisplay.textContent = kmh;
    // Gear indicator
    const g = kmh < 1 ? 'N' : kmh < 20 ? '1' : kmh < 50 ? '2' : kmh < 90 ? '3' : kmh < 150 ? '4' : kmh < 220 ? '5' : '6';
    gearDisplay.textContent = g;
    distDisplay.textContent = (S.distance / 1000).toFixed(1);
  }

  // ── Radio EQ (always active) ──
  updateRadioEQ();

  if (S.shakeTime > 0) {
    S.shakeTime -= dt;
    camera.position.x += (Math.random() - 0.5) * 0.3;
    camera.position.y += (Math.random() - 0.5) * 0.18;
  }

  updateExplosions(dt);
  renderer.render(scene, camera);
}

// ═══════════════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════════════
addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ═══════════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════════
animate();

console.log('Steuerung: Pfeiltasten / WASD');
console.log('NPCs fahren ab 200 km/h');
</script>
